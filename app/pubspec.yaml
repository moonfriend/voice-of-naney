name: naney
description: "Voice of Naney — oral heritage on a map."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.0

dependencies:
  dio: ^5.11.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_marker_cluster: ^8.2.2
  get_it: ^8.3.0
  go_router: ^17.0.0
  http: ^1.6.0
  injectable: ^2.5.1
  intl: ^0.19.0
  just_audio: ^0.10.6
  latlong2: ^0.9.1
  supabase_flutter: ^2.15.4
  video_player: ^2.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  build_runner: ^2.7.1
  injectable_generator: ^2.8.1

flutter:
  generate: true
  uses-material-design: true
